<svg xmlns="http://www.w3.org/2000/svg" width="610" height="276" viewBox="0 0 610 276">
  <rect width="610" height="276" fill="#fff"/>

  <!-- trapezoid outline + diagonal -->
  <line x1="12" y1="262" x2="598" y2="262" stroke="#222" stroke-width="4.5"/>
  <line x1="12" y1="262" x2="179" y2="13" stroke="#222" stroke-width="4.5"/>
  <line x1="598" y1="262" x2="432" y2="13" stroke="#222" stroke-width="4.5"/>
  <line x1="179" y1="13" x2="432" y2="13" stroke="#222" stroke-width="4.5"/>
  <line x1="12" y1="262" x2="432" y2="13" stroke="#222" stroke-width="4.5"/>

  <!-- angle marks -->
  <path d="M63.25,185.59 A92,92 0 0 1 91.13,215.09" fill="none" stroke="#222" stroke-width="3"/>
  <path d="M513.80,262.00 A84.2,84.2 0 0 1 551.30,191.95" fill="none" stroke="#222" stroke-width="3"/>

  <!-- lifted along the bisector: the wedge is too narrow near the vertex, so straight up would clip AC -->
  <text x="53" y="220" font-family="Times New Roman,serif" font-style="italic" font-size="42">&#945;</text>
  <text x="535.5" y="243" font-family="Times New Roman,serif" font-style="italic" font-size="38">&#946;</text>
</svg>
