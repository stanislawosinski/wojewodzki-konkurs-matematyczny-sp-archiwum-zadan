<svg xmlns="http://www.w3.org/2000/svg" width="528" height="404" viewBox="0 0 528 404">
  <rect width="528" height="404" fill="#fff"/>

  <!-- angle wedges (grey sectors), drawn first so lines/labels sit on top -->
  <path d="M 34.4,257.1 L 101.37,228.05 A 73,73 0 0 1 105.40,274.08 Z" fill="#e6e6e6" stroke="#4d4d4d" stroke-width="1.1"/>
  <path d="M 287.70,317.68 L 294.78,361.11 A 44,44 0 0 1 244.91,307.45 Z" fill="#e6e6e6" stroke="#4d4d4d" stroke-width="1.1"/>
  <path d="M 455.35,357.77 L 447.50,310.42 A 48,48 0 0 0 408.67,346.61 Z" fill="#e6e6e6" stroke="#4d4d4d" stroke-width="1.1"/>
  <path d="M 411.53,93.45 L 404.66,52.02 A 42,42 0 0 1 450.06,76.74 Z" fill="#e6e6e6" stroke="#4d4d4d" stroke-width="1.1"/>

  <!-- main construction lines -->
  <line x1="34.4" y1="257.1" x2="515.2" y2="48.4" stroke="#000" stroke-width="1.4"/>
  <line x1="34.4" y1="257.1" x2="515.2" y2="372.0" stroke="#000" stroke-width="1.4"/>
  <line x1="239.5" y1="21.8" x2="301.6" y2="403.1" stroke="#000" stroke-width="1.4"/>
  <line x1="399.6" y1="21.7" x2="462.9" y2="403.2" stroke="#000" stroke-width="1.4"/>

  <!-- vertex dot at O -->
  <circle cx="34.4" cy="257.1" r="3" fill="#000"/>

  <!-- point labels -->
  <text x="17" y="265" font-family="Times New Roman,serif" font-style="italic" font-size="22" text-anchor="middle">O</text>
  <text x="272" y="144" font-family="Times New Roman,serif" font-style="italic" font-size="22" text-anchor="middle">A</text>
  <text x="301" y="311" font-family="Times New Roman,serif" font-style="italic" font-size="22" text-anchor="middle">B</text>
  <text x="385" y="92" font-family="Times New Roman,serif" font-style="italic" font-size="22" text-anchor="middle">C</text>
  <text x="438" y="382" font-family="Times New Roman,serif" font-style="italic" font-size="22" text-anchor="middle">D</text>

  <!-- angle labels -->
  <text x="83" y="260" font-family="Times New Roman,serif" font-style="italic" font-size="20" text-anchor="middle">40°</text>
  <text x="270" y="340" font-family="Times New Roman,serif" font-style="italic" font-size="20" text-anchor="middle">z</text>
  <text x="423" y="76" font-family="Times New Roman,serif" font-style="italic" font-size="20" text-anchor="middle">x</text>
  <text x="436" y="341" font-family="Times New Roman,serif" font-style="italic" font-size="20" text-anchor="middle">y</text>
</svg>
