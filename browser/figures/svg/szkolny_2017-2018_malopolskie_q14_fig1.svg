  <rect x="505" y="246" width="96" height="95"/>
  <rect x="505" y="341" width="96" height="95"/>
  <rect x="601" y="341" width="95" height="95"/>
  <rect x="696" y="341" width="96" height="95"/>
  <rect x="792" y="341" width="96" height="95"/>
  <rect x="505" y="436" width="96" height="97"/>
