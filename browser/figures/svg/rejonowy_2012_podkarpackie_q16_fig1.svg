<svg xmlns="http://www.w3.org/2000/svg" width="515" height="390" viewBox="0 0 515 390">
  <rect width="515" height="390" fill="#fff"/>

  <!-- bottom square A L K B (solid) -->
  <line x1="38" y1="219" x2="38" y2="360.5" stroke="black" stroke-width="1.5"/>
  <line x1="38" y1="360.5" x2="180" y2="360.5" stroke="black" stroke-width="1.5"/>
  <line x1="180" y1="360.5" x2="180" y2="219" stroke="black" stroke-width="1.5"/>
  <line x1="38" y1="219" x2="180" y2="219" stroke="black" stroke-width="1.5"/>

  <!-- equilateral triangle A B C (solid) -->
  <line x1="38" y1="219" x2="109" y2="99" stroke="black" stroke-width="1.5"/>
  <line x1="109" y1="99" x2="180" y2="219" stroke="black" stroke-width="1.5"/>

  <!-- square B C M N (dotted) -->
  <line x1="109" y1="99" x2="232" y2="29" stroke="black" stroke-width="1.5" stroke-dasharray="1,3" stroke-linecap="round"/>
  <line x1="232" y1="29" x2="302" y2="148" stroke="black" stroke-width="1.5" stroke-dasharray="1,3" stroke-linecap="round"/>
  <line x1="302" y1="148" x2="180" y2="219" stroke="black" stroke-width="1.5" stroke-dasharray="1,3" stroke-linecap="round"/>

  <!-- labels -->
  <g font-family="Times New Roman,serif" font-size="24" font-style="italic" fill="black">
    <text x="221" y="26">M</text>
    <text x="95" y="89">C</text>
    <text x="307" y="165">N</text>
    <text x="14" y="234">A</text>
    <text x="19" y="376">L</text>
    <text x="180" y="378">K</text>
    <text x="183" y="238">B</text>
  </g>
</svg>
