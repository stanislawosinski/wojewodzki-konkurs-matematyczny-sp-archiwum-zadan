  <g font-family="Times New Roman,serif" font-style="italic" font-size="40" fill="#000">
    <text x="112" y="36" text-anchor="middle">D</text>
    <text x="879.5" y="40" text-anchor="middle">C</text>
    <text x="21" y="163" text-anchor="middle">A</text>
    <text x="800" y="162" text-anchor="middle">B</text>
