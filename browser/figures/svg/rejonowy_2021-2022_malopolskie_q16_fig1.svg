<svg xmlns="http://www.w3.org/2000/svg" width="903" height="173" viewBox="0 0 903 173">
  <rect width="903" height="173" fill="#fff"/>
  <!-- parallelogram ABCD (paper strip): A bottom-left, B bottom-right, C top-right, D top-left -->
  <polygon points="26.1,127.4 802.0,127.4 882.8,46.6 104.4,46.6" fill="#f3f3f3" stroke="#7f7f7f" stroke-width="1.5"/>
