<svg xmlns="http://www.w3.org/2000/svg" width="460" height="448" viewBox="0 0 460 448">
  <rect x="0" y="0" width="460" height="448" fill="#fff"/>

  <g stroke="#000" stroke-width="1.8" fill="none">
    <!-- central square -->
    <path d="M 143.5,149 L 302,149 L 302,308 L 143.5,308 Z"/>

    <!-- four equilateral-ish triangles (star points) -->
    <line x1="143.5" y1="149" x2="222.5" y2="17"/>
    <line x1="302"   y1="149" x2="222.5" y2="17"/>

    <line x1="143.5" y1="308" x2="222.5" y2="439"/>
    <line x1="302"   y1="308" x2="222.5" y2="439"/>

    <line x1="143.5" y1="149" x2="12" y2="228.5"/>
    <line x1="143.5" y1="308" x2="12" y2="228.5"/>

    <line x1="302" y1="149" x2="433" y2="228.5"/>
    <line x1="302" y1="308" x2="433" y2="228.5"/>
  </g>

  <!-- 3x3 grid of tangent circles inscribed in the square -->
  <g stroke="#000" stroke-width="1.8" fill="none">
    <circle cx="169.9"  cy="175.5" r="26.45"/>
    <circle cx="222.75" cy="175.5" r="26.45"/>
    <circle cx="275.6"  cy="175.5" r="26.45"/>
    <circle cx="169.9"  cy="228.5" r="26.45"/>
    <circle cx="222.75" cy="228.5" r="26.45"/>
    <circle cx="275.6"  cy="228.5" r="26.45"/>
    <circle cx="169.9"  cy="281.5" r="26.45"/>
    <circle cx="222.75" cy="281.5" r="26.45"/>
    <circle cx="275.6"  cy="281.5" r="26.45"/>
  </g>
</svg>
