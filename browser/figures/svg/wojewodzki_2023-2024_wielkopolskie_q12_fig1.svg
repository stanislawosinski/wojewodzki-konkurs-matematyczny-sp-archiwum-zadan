<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300">
  <rect width="560" height="300" fill="#fff"/>

  <!-- gray wedge marking angle x, apex at K -->
  <path d="M 244,221 L 201,163 A 72,72 0 0 1 287,164 Z" fill="#c6c6c6" stroke="none"/>

  <!-- small angle-mark arcs at A and B -->
  <path d="M 60,225 A 34,34 0 0 0 40,253" fill="none" stroke="#000" stroke-width="1"/>
  <path d="M 500,253 A 33,33 0 0 0 480,224" fill="none" stroke="#000" stroke-width="1"/>

  <!-- the two bisector lines (through K, ending in short stubs below AB) -->
  <line x1="111" y1="42" x2="294" y2="289" stroke="#000" stroke-width="1.3"/>
  <line x1="380" y1="41" x2="196" y2="284" stroke="#000" stroke-width="1.3"/>

  <!-- arc marking angle x -->
  <path d="M 201,163 A 72,72 0 0 1 287,164" fill="none" stroke="#000" stroke-width="1.3"/>

  <!-- trapezoid ABCD outline (bold) -->
  <path d="M 34,254 L 529,259 L 380,41 L 111,42 Z" fill="none" stroke="#000" stroke-width="7.5" stroke-linejoin="round"/>

  <!-- labels -->
  <text x="98" y="30" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" text-anchor="middle">D</text>
  <text x="399" y="27" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" text-anchor="middle">C</text>
  <text x="20" y="284" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" text-anchor="middle">A</text>
  <text x="543" y="286" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" text-anchor="middle">B</text>
  <text x="77" y="238" font-family="Times New Roman,serif" font-size="22" text-anchor="middle">&#945;</text>
  <text x="463" y="238" font-family="Times New Roman,serif" font-size="24" text-anchor="middle">&#946;</text>
  <text x="245" y="187" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="bold" text-anchor="middle">X</text>
  <text x="270" y="226" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle">K</text>
</svg>
