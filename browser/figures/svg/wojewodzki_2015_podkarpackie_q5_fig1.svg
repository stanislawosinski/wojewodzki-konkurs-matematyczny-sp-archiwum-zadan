<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="1520" viewBox="0 0 2480 1520">
  <rect width="2480" height="1520" fill="#fff"/>

  <!-- outer frame; the scan's top rule is 2px where the other three are 4px -->
  <g fill="#868686">
    <rect x="32" y="50" width="2404" height="2"/>
    <rect x="32" y="1448" width="2404" height="4"/>
    <rect x="32" y="50" width="4" height="1402"/>
    <rect x="2432" y="50" width="4" height="1402"/>
  </g>

  <!-- horizontal gridlines, each running out past the axis as its own tick -->
  <g fill="#868686">
    <rect x="310" y="138" width="1745" height="4"/>
    <rect x="310" y="288" width="1745" height="4"/>
    <rect x="310" y="438" width="1745" height="4"/>
    <rect x="310" y="588" width="1745" height="4"/>
    <rect x="310" y="738" width="1745" height="4"/>
    <rect x="310" y="887" width="1745" height="4"/>
    <rect x="310" y="1037" width="1745" height="4"/>
    <rect x="310" y="1187" width="1745" height="4"/>
  </g>

  <!-- bars -->
  <g fill="#787878">
    <rect x="456.6" y="290" width="173.4" height="1049"/>
    <rect x="888.6" y="440" width="173.5" height="899"/>
    <rect x="1321.3" y="1039" width="172.7" height="300"/>
  </g>

  <!-- axes drawn over the bars, plus the category ticks -->
  <g fill="#868686">
    <rect x="310" y="1337" width="1745" height="4"/>
    <rect x="325" y="138" width="4" height="1219"/>
    <rect x="757" y="1337" width="4" height="20"/>
    <rect x="1189" y="1337" width="4" height="20"/>
    <rect x="1621" y="1337" width="4" height="20"/>
    <rect x="2053" y="1337" width="4" height="20"/>
  </g>

  <g fill="#000" font-size="49.7">
    <text x="275" y="155" font-family="Helvetica,Arial,sans-serif" text-anchor="end">40%</text>
    <text x="275" y="305" font-family="Helvetica,Arial,sans-serif" text-anchor="end">35%</text>
    <text x="275" y="455" font-family="Helvetica,Arial,sans-serif" text-anchor="end">30%</text>
    <text x="275" y="605" font-family="Helvetica,Arial,sans-serif" text-anchor="end">25%</text>
    <text x="275" y="755" font-family="Helvetica,Arial,sans-serif" text-anchor="end">20%</text>
    <text x="275" y="905" font-family="Helvetica,Arial,sans-serif" text-anchor="end">15%</text>
    <text x="275" y="1055" font-family="Helvetica,Arial,sans-serif" text-anchor="end">10%</text>
    <text x="275" y="1205" font-family="Helvetica,Arial,sans-serif" text-anchor="end">5%</text>
    <text x="275" y="1355" font-family="Helvetica,Arial,sans-serif" text-anchor="end">0%</text>
    <text x="541.5" y="1427" font-family="Helvetica,Arial,sans-serif" text-anchor="middle">Le&#347;na droga</text>
    <text x="974" y="1427" font-family="Helvetica,Arial,sans-serif" text-anchor="middle">&#346;cie&#380;ka rowerowa</text>
    <text x="1405.5" y="1427" font-family="Helvetica,Arial,sans-serif" text-anchor="middle">Polna droga</text>
    <text x="1838.5" y="1427" font-family="Helvetica,Arial,sans-serif" text-anchor="middle">Chodnik</text>
  </g>
</svg>
