<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
  <rect width="600" height="200" fill="#fff"/>

  <!-- three thin circles (equal radius) -->
  <circle cx="98.6" cy="99.1" r="90.3" fill="none" stroke="#000" stroke-width="2.2"/>
  <circle cx="280.0" cy="99.1" r="90.3" fill="none" stroke="#000" stroke-width="2.2"/>
  <circle cx="460.5" cy="99.1" r="90.3" fill="none" stroke="#000" stroke-width="2.2"/>

  <!-- bold outer belt: left semicircle + top line + right semicircle + bottom line -->
  <path d="M 98.6 8.8
           L 460.5 8.8
           A 90.3 90.3 0 0 1 460.5 189.4
           L 98.6 189.4
           A 90.3 90.3 0 0 1 98.6 8.8
           Z"
        fill="none" stroke="#000" stroke-width="6" stroke-linejoin="round"/>

  <!-- radius lines -->
  <line x1="98.6" y1="99.1" x2="188.9" y2="99.1" stroke="#000" stroke-width="2"/>
  <line x1="280.0" y1="99.1" x2="370.3" y2="99.1" stroke="#000" stroke-width="2"/>
  <line x1="460.5" y1="99.1" x2="550.8" y2="99.1" stroke="#000" stroke-width="2"/>

  <!-- center dots -->
  <circle cx="98.6" cy="99.1" r="4" fill="#000"/>
  <circle cx="280.0" cy="99.1" r="4" fill="#000"/>
  <circle cx="460.5" cy="99.1" r="4" fill="#000"/>

  <!-- r labels -->
  <text x="139" y="95" font-family="Times New Roman,serif" font-size="27" font-style="italic">r</text>
  <text x="316" y="95" font-family="Times New Roman,serif" font-size="27" font-style="italic">r</text>
  <text x="499" y="95" font-family="Times New Roman,serif" font-size="27" font-style="italic">r</text>
</svg>
