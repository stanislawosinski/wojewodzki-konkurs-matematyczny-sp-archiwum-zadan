  <path d="M 479.00,316.00 A 170,170 0 0 1 497.79,238.31" fill="none" stroke="#000" stroke-width="1.3"/>
  <!-- bold quadrilateral -->
  <path d="M 78,316 L 152,63.5 L 449,63.5 L 649,316 Z" fill="none" stroke="#000" stroke-width="8"/>
