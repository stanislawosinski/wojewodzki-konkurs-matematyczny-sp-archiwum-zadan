<!-- the scan is squashed horizontally by k=0.852 (node blobs 13-14 wide x 15-17 tall), so every
     vertex-centred angle mark is an ellipse with rx = 0.852*ry, not a circle: constrained fits
     land at 0.4px std on all five marks.  AB and BC are drawn as ONE straight line (least-squares
     fit y = 437.12 - 0.019362x over both segments' ink, rms 0.53px) even though the scan kinks
     at B: reviewer request. -->
