<svg xmlns="http://www.w3.org/2000/svg" width="300" height="345" viewBox="0 0 300 345">
  <rect width="300" height="345" fill="#fff"/>

  <!-- Front face (visible rectangle) -->
  <path d="M25,57 L146,57 L146,296 L25,296 Z" fill="none" stroke="#000" stroke-width="4" stroke-linejoin="round"/>

  <!-- Top face (parallelogram): back-top edge + two receding diagonals -->
  <line x1="70" y1="17" x2="191" y2="17" stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <line x1="25" y1="57" x2="70" y2="17" stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <line x1="146" y1="57" x2="191" y2="17" stroke="#000" stroke-width="4" stroke-linecap="round"/>

  <!-- Right face: back-right vertical edge + receding bottom diagonal -->
  <line x1="191" y1="17" x2="191" y2="256" stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <line x1="146" y1="296" x2="191" y2="256" stroke="#000" stroke-width="4" stroke-linecap="round"/>

  <!-- Hidden edges (dashed) meeting at the occluded back-bottom-left vertex -->
  <line x1="70" y1="17" x2="70" y2="256" stroke="#000" stroke-width="3" stroke-dasharray="9,4"/>
  <line x1="70" y1="256" x2="191" y2="256" stroke="#000" stroke-width="3" stroke-dasharray="9,4"/>
  <line x1="70" y1="256" x2="25" y2="296" stroke="#000" stroke-width="3" stroke-dasharray="9,4"/>

  <!-- Labels -->
  <text x="58" y="317" font-family="Times New Roman,serif" font-size="20" font-weight="bold" font-style="italic">x + 1</text>
  <text x="202" y="143" font-family="Times New Roman,serif" font-size="20" font-weight="bold" font-style="italic">x + 3</text>
  <text x="173" y="289" font-family="Times New Roman,serif" font-size="18" font-weight="bold" font-style="italic">x</text>
</svg>
