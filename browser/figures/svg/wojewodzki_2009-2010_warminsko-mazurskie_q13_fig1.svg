<svg xmlns="http://www.w3.org/2000/svg" width="212" height="210" viewBox="0 0 212 210">
<rect x="0" y="0" width="212" height="210" fill="#fff"/>
<g stroke="#1a1a1a" stroke-linecap="round" fill="none">
<!-- outer square -->
<rect x="11.5" y="11.5" width="188" height="186" stroke-width="1.6"/>
<!-- inner square (with two overshoot corners) -->
<line x1="59.5" y1="59.5" x2="59.5" y2="151.5" stroke-width="1.6"/>
<line x1="52" y1="59.5" x2="151.5" y2="59.5" stroke-width="1.6"/>
<line x1="151.5" y1="59.5" x2="151.5" y2="151.5" stroke-width="1.6"/>
<line x1="59.5" y1="151.5" x2="159" y2="151.5" stroke-width="1.6"/>
<!-- isolated short construction dashes near inner-square corners -->
<line x1="36" y1="59.5" x2="44" y2="59.5" stroke-width="1.6"/>
<line x1="151.5" y1="27" x2="151.5" y2="35" stroke-width="1.6"/>
<line x1="151.5" y1="44" x2="151.5" y2="52" stroke-width="1.6"/>
<line x1="167" y1="151.5" x2="175" y2="151.5" stroke-width="1.6"/>
<line x1="59.5" y1="157" x2="59.5" y2="165" stroke-width="1.6"/>
<line x1="59.5" y1="174" x2="59.5" y2="182" stroke-width="1.6"/>
<!-- tilted square; solid, at the scan's measured 2.0px perpendicular width -->
<line x1="149" y1="11.5" x2="199.5" y2="149" stroke-width="2"/>
<line x1="199.5" y1="149" x2="62" y2="197.5" stroke-width="2"/>
<line x1="62" y1="197.5" x2="11.5" y2="60" stroke-width="2"/>
<line x1="11.5" y1="60" x2="149" y2="11.5" stroke-width="2"/>
</g>
<g fill="#1a1a1a" stroke="none">
<circle cx="149" cy="11.5" r="1.8"/>
<circle cx="199.5" cy="149" r="1.8"/>
<circle cx="62" cy="197.5" r="1.8"/>
<circle cx="11.5" cy="60" r="1.8"/>
</g>
</svg>
