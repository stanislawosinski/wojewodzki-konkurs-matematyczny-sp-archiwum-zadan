<svg xmlns="http://www.w3.org/2000/svg" width="466" height="504" viewBox="0 0 466 504">
<rect width="466" height="504" fill="#fff"/>
<!-- Cube frame of 12 square beams, generated rather than traced.
     Model is the unit cube (u,v,w) = (right, down, into-the-page), mapped by
       p = (11.0,131.0) + u*(314.2,-3.2) + v*(2.2,307.7) + w*(126.7,-117.8)
     least-squares fitted to the 7 outer corners visible in the scan.
     Beam cross-section 0.101 of the side across a face, 0.155 in depth — the scan
     really is drawn that way (measured off row/column edge pairs), not square.
     Paths are the boundary of the frame as one solid, so beams meet seamlessly:
     first the inner faces seen through the windows (far to near, opaque so the
     nearer ones cover), then the three outer faces as annuli. -->
<g fill="#fff" stroke="#000" stroke-width="2.6" stroke-linejoin="miter">
<path d="M 150.1,62.3 L 151.9,307.8 L 171.5,289.6 L 169.7,44.0 Z"/>
