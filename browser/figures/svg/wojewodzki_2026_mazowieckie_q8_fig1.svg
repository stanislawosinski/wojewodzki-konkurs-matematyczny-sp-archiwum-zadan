        fill="#6f6f6f" stroke="#000" stroke-width="2.5"/>
  <!-- outer circle -->
  <circle cx="198.7" cy="196.23" r="165.3" fill="none" stroke="#000" stroke-width="2.8"/>
  <!-- vertical diameter -->
  <line x1="198.7" y1="30.93" x2="198.7" y2="361.53" stroke="#000" stroke-width="2.8"/>
  <!-- center dot -->
  <circle cx="198.7" cy="196.23" r="5" fill="#000"/>
