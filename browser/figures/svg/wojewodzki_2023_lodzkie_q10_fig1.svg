<svg xmlns="http://www.w3.org/2000/svg" width="470" height="430" viewBox="0 0 470 430">
  <rect x="0" y="0" width="470" height="430" fill="#fff"/>

  <!-- gray inscribed-pyramid lateral edges (apex = bottom-face center) -->
  <g stroke="#808080" stroke-width="5" stroke-linecap="round">
    <line x1="222.6" y1="330.5" x2="58.8"  y2="145.5"/>
    <line x1="222.6" y1="330.5" x2="295.9" y2="149.0"/>
    <line x1="222.6" y1="330.5" x2="147.4" y2="32.9"/>
    <line x1="222.6" y1="330.5" x2="383.7" y2="32.9"/>
  </g>

  <!-- thin bottom-face diagonals (construction lines to center) -->
  <g stroke="#000" stroke-width="1.2">
    <line x1="56.9"  y1="385.8" x2="386.9" y2="274.6"/>
    <line x1="148.2" y1="272.5" x2="298.6" y2="388.9"/>
  </g>

  <!-- cube edges, solid -->
  <g stroke="#000" stroke-width="4.3" fill="none">
    <line x1="58.8"  y1="145.5" x2="295.9" y2="149.0"/>
    <line x1="295.9" y1="149.0" x2="383.7" y2="32.9"/>
    <line x1="383.7" y1="32.9"  x2="147.4" y2="32.9"/>
    <line x1="147.4" y1="32.9"  x2="58.8"  y2="145.5"/>

    <line x1="56.9"  y1="385.8" x2="298.6" y2="388.9"/>
    <line x1="298.6" y1="388.9" x2="386.9" y2="274.6"/>
    <line x1="386.9" y1="274.6" x2="148.2" y2="272.5"/>
    <line x1="148.2" y1="272.5" x2="56.9"  y2="385.8"/>

    <line x1="58.8"  y1="145.5" x2="56.9"  y2="385.8"/>
    <line x1="295.9" y1="149.0" x2="298.6" y2="388.9"/>
    <line x1="147.4" y1="32.9"  x2="148.2" y2="272.5"/>
    <line x1="383.7" y1="32.9"  x2="386.9" y2="274.6"/>
  </g>

  <circle cx="222.6" cy="330.5" r="3.3" fill="#000"/>
</svg>
