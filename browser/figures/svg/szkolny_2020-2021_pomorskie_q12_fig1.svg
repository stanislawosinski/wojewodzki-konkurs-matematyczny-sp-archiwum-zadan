<svg xmlns="http://www.w3.org/2000/svg" width="560" height="520" viewBox="0 0 560 520">
  <rect x="0" y="0" width="560" height="520" fill="#fff"/>

  <path d="M 175.5 42 L 350 42 L 350 160 L 468 160 L 468 341 L 349 341 L 349 464 L 172 464 L 172 341 L 52 341 L 52 162 L 176 162 Z"
        fill="none" stroke="#000" stroke-width="3.5" stroke-linejoin="miter"/>

  <!-- Dimension labels. Every label keeps the same 7.25px clearance between its
       glyph ink and the near edge of the 3.5px stroke it annotates; that is the
       gap of the "2m" over the y=160 edge, which the review called correct.
       x is the text origin, i.e. the label's left edge (no text-anchor): MuPDF
       ignores text-anchor, so a centred label lands ~15px right of where a
       browser puts it. These x are the former centres minus half the advance,
       so the browser rendering is unchanged. -->
  <g font-family="Helvetica,Arial,sans-serif" font-size="21">
    <text x="248.42" y="33">3m</text>
    <text x="183.95" y="105">2m</text>
    <text x="313.18" y="107">2m</text>
    <text x="388.42" y="151">2m</text>
    <text x="100.42" y="153">2m</text>
    <text x="15.18"  y="257">3m</text>
    <text x="476.29" y="262">3m</text>
    <text x="113.42" y="364.8">2m</text>
    <text x="407.42" y="364.8">2m</text>
    <text x="180.45" y="403">2m</text>
    <text x="312.18" y="403">2m</text>
    <text x="253.42" y="487.8">3m</text>
  </g>
</svg>
