<svg xmlns="http://www.w3.org/2000/svg" width="210" height="615" viewBox="0 0 210 615">
<!--
  Two stacked-cube boxes (1x1x2 and 1x1x3) sharing one lattice.
  Projection basis, least squares over every measured line centre
  (4 vertical x-centroids + 14 horizontal y-centroids, sub-pixel):
     P(i,j,k) = O + i*R + j*B + k*U     i=right j=depth(0 back,1 front) k=down
     O = (26.655, 25.780)   R = (82.870, 0)   B = (40.912, 41.400)   U = (0, 82.665)
     rms residual 0.31 px, max 0.50 px
  Occupancy: cubes at k = 0,1 and k = 3,4,5; the k=2 cell is elided
  and drawn as the dotted continuation lines.
  Hidden-edge test: the view direction is the kernel of the 2x3
  projection [R B U], d = (-0.4038, 0.8180, -0.4097), oriented so +j (depth)
  points at the viewer.  Each edge is sampled at 160 points; a sample
  is hidden when the ray p + t*d, t>0, penetrates the interior of any
  occupied unit cell by more than 0.05 lattice units (slab test).
  Visible runs are merged into maximal collinear segments and drawn
  solid; hidden runs are drawn dashed 18 on / 17 off, matching the
  scan, which resets the dash phase at every cube boundary.
  Dashes are emitted as explicit segments, not stroke-dasharray,
  because the checker's rasterizer (MuPDF) renders dasharray solid.
  Dash phase runs from the bottom on vertical hidden edges, from the
  front on the depth diagonals, and from the right on the back
  horizontals except at a box's bottom face, where the scan starts
  them from the left.
  Stroke 2.2 px = the scan's coverage-integrated cross-section
  (2.10-2.44 over eight lines).  Line ends overshoot their corner by
  1.5 px, as the scan does.  Continuation dots are r=1.6 circles, area
  matched to the scan's 7.3-8.3 px blobs, spaced 8.19 px.
-->
<rect width="210" height="615" fill="#fff"/>
<g stroke="#000" fill="none" stroke-width="2.2" stroke-linecap="butt">
<!-- visible edges -->
<line x1="26.66" y1="24.28" x2="26.66" y2="192.61"/>
