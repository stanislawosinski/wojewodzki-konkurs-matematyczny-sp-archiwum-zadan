<rect width="585" height="500" fill="#fff"/>
<!-- Cube with a pyramid on each face; hidden edges dotted.
     Model is the unit cube (u,v,w) = (right, down, into-the-page), mapped by
       p = (196.8,227.5) + u*(156,0) + v*(0,96) + w*(46.4,-47)
     with apexes 1.3333, 2.0, 2.6681 cube-sides out along x, y, z.
     Solid/dashed is computed, not assigned: each of the 36 edges is sampled and
     ray-cast against the 24 triangles, so edges that pass behind another spike
     break into a solid run and a dotted run at the crossing. -->
