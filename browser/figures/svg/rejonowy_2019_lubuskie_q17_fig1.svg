<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="410" viewBox="0 0 1040 410">
<!-- 3D tubes: each bar is one rect filled with the measured cylindrical gradient #tube
     (horizontal profile sampled off the bitmap, highlight at 0.498 of the width, falling to
     gray 140 at both edges), a #foot white overlay for the fade into the axis, and a dark
     ellipse cap on top. MuPDF (scripts/figcheck.py) has no gradients and paints every
     fill="url(#..)" solid black, so its score for this figure is meaningless; a browser,
     which is what the reviewer looks at, renders the shading correctly. -->
<defs>
<linearGradient id="tube" x1="0" y1="0" x2="1" y2="0">
<stop offset="0.0000" stop-color="#fafafa"/>
<stop offset="0.0070" stop-color="#f1f1f1"/>
<stop offset="0.0110" stop-color="#e7e7e7"/>
<stop offset="0.0240" stop-color="#c2c2c2"/>
<stop offset="0.0350" stop-color="#9d9d9d"/>
<stop offset="0.0380" stop-color="#969696"/>
<stop offset="0.0410" stop-color="#919191"/>
<stop offset="0.0500" stop-color="#8c8c8c"/>
<stop offset="0.0660" stop-color="#9b9b9b"/>
<stop offset="0.0820" stop-color="#afafaf"/>
<stop offset="0.1060" stop-color="#bcbcbc"/>
<stop offset="0.1320" stop-color="#c6c6c6"/>
<stop offset="0.3440" stop-color="#e7e7e7"/>
<stop offset="0.3860" stop-color="#ececec"/>
<stop offset="0.4750" stop-color="#fcfcfc"/>
<stop offset="0.4980" stop-color="#fefefe"/>
<stop offset="0.5310" stop-color="#fcfcfc"/>
<stop offset="0.5810" stop-color="#f2f2f2"/>
<stop offset="0.7630" stop-color="#d7d7d7"/>
<stop offset="0.8680" stop-color="#c4c4c4"/>
<stop offset="0.8890" stop-color="#bebebe"/>
<stop offset="0.9180" stop-color="#aeaeae"/>
<stop offset="0.9310" stop-color="#a3a3a3"/>
<stop offset="0.9450" stop-color="#909090"/>
<stop offset="0.9510" stop-color="#8e8e8e"/>
<stop offset="0.9600" stop-color="#939393"/>
<stop offset="0.9650" stop-color="#9e9e9e"/>
<stop offset="0.9720" stop-color="#b2b2b2"/>
<stop offset="0.9790" stop-color="#cbcbcb"/>
<stop offset="0.9870" stop-color="#e3e3e3"/>
<stop offset="1.0000" stop-color="#fafafa"/>
</linearGradient>
<linearGradient id="foot" gradientUnits="userSpaceOnUse" x1="0" y1="263.0" x2="0" y2="277.6">
<stop offset="0.000" stop-color="#fff" stop-opacity="0.00"/>
<stop offset="0.137" stop-color="#fff" stop-opacity="0.02"/>
<stop offset="0.274" stop-color="#fff" stop-opacity="0.06"/>
<stop offset="0.411" stop-color="#fff" stop-opacity="0.17"/>
<stop offset="0.548" stop-color="#fff" stop-opacity="0.38"/>
<stop offset="0.616" stop-color="#fff" stop-opacity="0.51"/>
<stop offset="0.685" stop-color="#fff" stop-opacity="0.64"/>
<stop offset="0.753" stop-color="#fff" stop-opacity="0.79"/>
<stop offset="0.822" stop-color="#fff" stop-opacity="0.90"/>
<stop offset="0.890" stop-color="#fff" stop-opacity="0.95"/>
<stop offset="1.000" stop-color="#fff" stop-opacity="1.00"/>
</linearGradient>
</defs>
<rect width="1040" height="410" fill="#fff"/>
<!-- poniedzia&#322;ek 26 -->
