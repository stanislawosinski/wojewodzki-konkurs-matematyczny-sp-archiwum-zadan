<text x="0" y="0" text-anchor="end" transform="translate(428.8 296.6) rotate(-90) scale(0.678 1)" font-family="Helvetica,Arial,sans-serif" font-size="28.5" font-weight="bold" fill="#000">&#347;roda</text>
