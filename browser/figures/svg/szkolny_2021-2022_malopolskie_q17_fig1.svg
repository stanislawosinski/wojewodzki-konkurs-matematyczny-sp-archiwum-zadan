<svg xmlns="http://www.w3.org/2000/svg" width="600" height="390" viewBox="0 0 600 390">
  <rect width="600" height="390" fill="#fff"/>
  <!-- trapezoid edges -->
  <path d="M 90 61 L 364 61 L 460 328 L 41 328 Z" fill="none" stroke="#404040" stroke-width="2.5"/>
  <!-- diagonal AC -->
  <path d="M 41 328 L 364 61" fill="none" stroke="#404040" stroke-width="2.5"/>
  <!-- angle arc at A (0 to 40 deg) -->
  <path d="M 150 328 A 109 109 0 0 0 124.5 257.9" fill="none" stroke="#404040" stroke-width="1.3"/>
  <!-- vertex dots -->
  <circle cx="90" cy="61" r="4" fill="#404040"/>
  <circle cx="364" cy="61" r="4" fill="#404040"/>
  <circle cx="460" cy="328" r="4" fill="#404040"/>
  <circle cx="41" cy="328" r="4" fill="#404040"/>
  <circle cx="313" cy="328" r="4" fill="#404040"/>
  <!-- labels -->
  <text x="97" y="43" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#000" text-anchor="middle">D</text>
  <text x="353" y="43" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#000" text-anchor="middle">C</text>
  <text x="41" y="367" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#000" text-anchor="middle">A</text>
  <text x="318" y="365" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#000" text-anchor="middle">E</text>
  <text x="454" y="365" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#000" text-anchor="middle">B</text>
  <text x="112" y="309" font-family="Helvetica,Arial,sans-serif" font-size="21" fill="#000" text-anchor="middle">40°</text>
</svg>
