<svg xmlns="http://www.w3.org/2000/svg" width="901" height="397" viewBox="0 0 901 397">
  <rect width="901" height="397" fill="#fff"/>

  <!-- parallel lines m (top) and n (bottom) -->
  <line x1="10" y1="54.5" x2="890" y2="54.5" stroke="#000" stroke-width="2.2"/>
  <line x1="10" y1="345.5" x2="888" y2="345.5" stroke="#000" stroke-width="2.2"/>

  <!-- polyline D-C-B-A -->
  <line x1="648.5" y1="54.5" x2="356.5" y2="223.0" stroke="#000" stroke-width="2.2"/>
  <line x1="356.5" y1="223.0" x2="564.3" y2="205.25" stroke="#000" stroke-width="2.2"/>
  <line x1="564.3" y1="205.25" x2="446.83" y2="345.5" stroke="#000" stroke-width="2.2"/>

  <!-- angle arcs; stroke 2.2 = radial ink profile of the scan's arcs (2.4 measured, same pen as the lines) -->
  <!-- x at C -->
  <path d="M 462.16 162.0 A 122 122 0 0 1 478.06 212.62" fill="none" stroke="#000" stroke-width="2.2"/>
  <!-- 45deg at B -->
  <path d="M 461.58 214.06 A 103.1 103.1 0 0 0 498.10 284.29" fill="none" stroke="#000" stroke-width="2.2"/>
  <!-- 2x at A -->
  <path d="M 506.42 274.36 A 92.8 92.8 0 0 1 539.63 345.5" fill="none" stroke="#000" stroke-width="2.2"/>
  <!-- 150deg at D. NOT vertex-centred: least-squares fit of the scan's arc ink gives
       centre (651.3, 47.25) r 71.68, rms 1.07px, 7.8px off D — the scan's arc really is
       drawn that way (it meets m at x=722.5, and a D-centred r=65 arc misses by 9px;
       local chamfer 1.00 as fitted vs 0.77 centred). Endpoints are the fitted circle's
       intersections with leg DC and with line m, so both still touch their legs. -->
  <path d="M 591.80 87.22 A 71.68 71.68 0 0 0 722.60 54.5" fill="none" stroke="#000" stroke-width="2.2"/>

  <!-- labels. MuPDF ignores text-anchor, so x is the left edge: every x/y below was
       solved so the *rendered* glyph ink box centres on the scan's measured ink box
       centre. Sizes are from the scan's ink heights (capitals 28px, digits/x-height
       24/17px), not carried over from the source SVG. -->
  <text x="14.0" y="39.0" font-family="Times New Roman,serif" font-style="italic" font-size="36">m</text>
  <text x="20.0" y="332.0" font-family="Times New Roman,serif" font-style="italic" font-size="36">n</text>
  <text x="643.0" y="36.0" font-family="Times New Roman,serif" font-style="italic" font-size="38">D</text>
  <text x="316.0" y="226.0" font-family="Times New Roman,serif" font-style="italic" font-size="38">C</text>
  <text x="590.0" y="212.0" font-family="Times New Roman,serif" font-style="italic" font-size="38">B</text>
  <text x="430.0" y="386.0" font-family="Times New Roman,serif" font-style="italic" font-size="38">A</text>
  <text x="431.0" y="205.0" font-family="Times New Roman,serif" font-style="italic" font-size="36">x</text>
  <text x="479.5" y="247.0" font-family="Times New Roman,serif" font-size="36">45°</text>
  <text x="486.5" y="333.0" font-family="Times New Roman,serif" font-size="36">2x</text>
  <!-- ink box centres on (664, 87) = 36px from D along the 150deg wedge, as in the scan -->
  <text x="628.5" y="99.0" font-family="Times New Roman,serif" font-size="36">150°</text>
</svg>
