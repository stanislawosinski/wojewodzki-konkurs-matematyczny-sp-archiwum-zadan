<svg xmlns="http://www.w3.org/2000/svg" width="540" height="450" viewBox="0 0 540 450">
  <rect width="540" height="450" fill="#fff"/>
  <g stroke="#000" stroke-width="1" fill="none">
    <line x1="23.5" y1="14" x2="23.5" y2="422"/>
    <line x1="102.5" y1="14" x2="102.5" y2="422"/>
    <line x1="181.5" y1="14" x2="181.5" y2="422"/>
    <line x1="260.5" y1="14" x2="260.5" y2="422"/>
    <line x1="338.5" y1="14" x2="338.5" y2="422"/>
