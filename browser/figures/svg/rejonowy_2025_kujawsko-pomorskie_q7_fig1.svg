  <line x1="52" y1="301" x2="73" y2="301" stroke="#000" stroke-width="4"/>

  <!-- multiplication mark: a filled 7x7 square in the scan, not a round dot -->
  <rect x="217" y="130" width="7" height="7" fill="#000"/>

  <g font-size="39" fill="#000">
    <text x="286" y="69" font-family="Helvetica,Arial,sans-serif">K</text>
