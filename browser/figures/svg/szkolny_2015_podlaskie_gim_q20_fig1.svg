<svg xmlns="http://www.w3.org/2000/svg" width="590" height="400" viewBox="0 0 590 400">
  <rect width="590" height="400" fill="#fff"/>

  <!-- shaded 315 deg sector: apex S, arc the long way round from R to P -->
  <path d="M 210.00 178.90 L 317.42 67.50 A 159.3 159.3 0 1 0 364.96 178.90 Z" fill="#d9d9d9" stroke="#000" stroke-width="1.1"/>

  <!-- rhombus SPQR -->
  <path d="M 210.00 178.90 L 364.96 178.90 L 472.34 67.50 L 317.42 67.50 Z" fill="none" stroke="#000" stroke-width="1"/>

  <!-- 45 deg angle mark at S -->
  <path d="M 280.00 178.90 A 70 70 0 0 0 258.61 128.52" fill="none" stroke="#000" stroke-width="1"/>

  <text x="316.0" y="57.5" font-family="Times New Roman,serif" font-size="33" text-anchor="middle" fill="#000">R</text>
  <text x="488.5" y="58.0" font-family="Times New Roman,serif" font-size="33" text-anchor="middle" fill="#000">Q</text>
  <text x="200.5" y="210.8" font-family="Times New Roman,serif" font-size="33" text-anchor="middle" fill="#000">S</text>
  <text x="375.5" y="210.5" font-family="Times New Roman,serif" font-size="33" text-anchor="middle" fill="#000">P</text>
  <text x="253.5" y="173.5" font-family="Times New Roman,serif" font-size="33" font-style="italic" text-anchor="middle" fill="#000">45&#176;</text>
</svg>
