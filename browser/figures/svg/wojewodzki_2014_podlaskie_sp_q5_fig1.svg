<svg xmlns="http://www.w3.org/2000/svg" width="697" height="438" viewBox="0 0 697 438">
  <rect x="0" y="0" width="697" height="438" fill="#fff"/>

  <!-- horizontal gridlines (values 1-8) -->
  <line x1="11" y1="226.5" x2="685" y2="226.5" stroke="#808080" stroke-width="1"/>
  <line x1="11" y1="199.5" x2="685" y2="199.5" stroke="#808080" stroke-width="1"/>
  <line x1="11" y1="172.5" x2="685" y2="172.5" stroke="#808080" stroke-width="1"/>
  <line x1="11" y1="146.5" x2="685" y2="146.5" stroke="#808080" stroke-width="1"/>
  <line x1="11" y1="120.5" x2="685" y2="120.5" stroke="#808080" stroke-width="1"/>
  <line x1="11" y1="94.5"  x2="685" y2="94.5"  stroke="#808080" stroke-width="1"/>
  <line x1="11" y1="67.5"  x2="685" y2="67.5"  stroke="#808080" stroke-width="1"/>
  <line x1="11" y1="42.5"  x2="685" y2="42.5"  stroke="#808080" stroke-width="1"/>
  <!-- axis (value 0) -->
  <line x1="11" y1="251.5" x2="685" y2="251.5" stroke="#808080" stroke-width="1.2"/>

  <!-- x-axis tick marks (category boundaries) -->
  <line x1="68.5"  y1="251.5" x2="68.5"  y2="256" stroke="#808080" stroke-width="1"/>
  <line x1="186.5" y1="251.5" x2="186.5" y2="256" stroke="#808080" stroke-width="1"/>
  <line x1="303.5" y1="251.5" x2="303.5" y2="256" stroke="#808080" stroke-width="1"/>
  <line x1="419.5" y1="251.5" x2="419.5" y2="256" stroke="#808080" stroke-width="1"/>
  <line x1="537.5" y1="251.5" x2="537.5" y2="256" stroke="#808080" stroke-width="1"/>
  <line x1="655"   y1="251.5" x2="655"   y2="256" stroke="#808080" stroke-width="1"/>

  <!-- bars -->
  <rect x="105" y="200" width="46" height="51.5" fill="#787878"/>
  <rect x="222" y="148" width="47" height="103.5" fill="#787878"/>
  <rect x="339" y="121" width="46" height="130.5" fill="#787878"/>
  <rect x="456" y="69"  width="46" height="182.5" fill="#787878"/>
  <rect x="574" y="95"  width="46" height="156.5" fill="#787878"/>

  <!-- outer border box -->
  <rect x="10" y="10" width="676" height="417" fill="none" stroke="#808080" stroke-width="1.4"/>

  <!-- value labels above bars -->
  <text x="128"   y="180" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="middle">2</text>
  <text x="245.5" y="126" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="middle">4</text>
  <text x="362"   y="99"  font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="middle">5</text>
  <text x="479"   y="47"  font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="middle">7</text>
  <text x="597"   y="74"  font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="middle">6</text>

  <!-- y-axis tick labels -->
  <text x="45" y="260" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="end">0</text>
  <text x="45" y="234" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="end">1</text>
  <text x="45" y="208" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="end">2</text>
  <text x="45" y="181" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="end">3</text>
  <text x="45" y="154" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="end">4</text>
  <text x="45" y="128" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="end">5</text>
  <text x="45" y="102" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="end">6</text>
  <text x="45" y="75"  font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="end">7</text>
  <text x="45" y="49"  font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="end">8</text>

  <!-- rotated category labels (~45deg) -->
  <g font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="start">
    <text x="0" y="0" transform="translate(63,262) rotate(45)">celujące</text>
    <text x="0" y="0" transform="translate(181,262) rotate(45)">bardzo dobre</text>
    <text x="0" y="0" transform="translate(298,262) rotate(45)">dobre</text>
    <text x="0" y="0" transform="translate(414,262) rotate(45)">dostateczne</text>
    <text x="0" y="0" transform="translate(532,262) rotate(45)">dopuszczające</text>
  </g>
</svg>
