<svg xmlns="http://www.w3.org/2000/svg" width="600" height="315" viewBox="0 0 600 315">
  <rect width="600" height="315" fill="#fff"/>

  <!-- rays through O: horizontal (O,A,B) and slanted (O,C) -->
  <line x1="50" y1="245.93" x2="530" y2="246.09" stroke="#4d4d4d" stroke-width="2.4"/>
  <line x1="50" y1="295.87" x2="530" y2="17.91" stroke="#4d4d4d" stroke-width="2.4"/>

  <!-- triangle ABC fill -->
  <path d="M 303.5 246 L 386.5 100.9 L 469.7 246 Z" fill="#f5ebe6" stroke="none"/>

  <!-- triangle sides A-C and C-B -->
  <line x1="303.5" y1="246" x2="386.5" y2="100.9" stroke="#382216" stroke-width="2.2"/>
  <line x1="386.5" y1="100.9" x2="469.7" y2="246" stroke="#382216" stroke-width="2.2"/>

  <!-- base A-B, thicker maroon -->
  <line x1="303.5" y1="246" x2="469.7" y2="246" stroke="#7c2e06" stroke-width="3.6"/>

  <!-- points -->
  <circle cx="136.3" cy="246.0" r="4.3" fill="#000"/>
  <circle cx="303.5" cy="246.0" r="4.3" fill="#000"/>
  <circle cx="469.7" cy="246.0" r="4.3" fill="#000"/>
  <circle cx="386.5" cy="100.9" r="4.3" fill="#000"/>

  <!-- labels -->
  <text x="138" y="291" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#000" text-anchor="middle">O</text>
  <text x="306" y="293" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#000" text-anchor="middle">A</text>
  <text x="471" y="293" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#000" text-anchor="middle">B</text>
  <text x="390" y="80" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#000" text-anchor="middle">C</text>
</svg>
