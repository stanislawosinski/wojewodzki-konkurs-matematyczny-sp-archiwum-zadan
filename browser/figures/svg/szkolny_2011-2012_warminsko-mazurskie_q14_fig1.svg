<rect width="590" height="409" fill="#fff"/>
<!-- Pyramid of unit cubes in axonometric projection.  A lattice vertex
     (i,j,k) maps to O + i*R + j*B + k*U with O=(10.05,356.6),
     R=(69.28,8.28) right, B=(44.56,-39.16) back,
     U=(0,-81.78) up; least-squares fit to the 21 vertical
     edges measured off the scan, then refined against its ink (mean
     chamfer 0.17px).  Solid: 5x5 base, 3x3
     second layer at offset (1,1), one cube at (2,2).  Only the visible
     part of every edge is emitted: sample points whose ray towards the
     viewer enters an occupied cell are dropped, so an edge running
     behind a nearer cube stops at that cube's silhouette. -->
