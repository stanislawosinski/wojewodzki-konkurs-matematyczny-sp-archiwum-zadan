<svg xmlns="http://www.w3.org/2000/svg" width="510" height="345" viewBox="0 0 510 345">
<rect width="510" height="345" fill="#fff"/>
<g fill="none" stroke="#333" stroke-width="1.4" stroke-linejoin="round">
<!-- front pentagon (house) outline -->
<path d="M 4 173 L 111 122 L 216 194 L 216 284 L 4 256 Z"/>
<!-- eave line (roofline base) -->
<line x1="4" y1="173" x2="216" y2="194"/>
<!-- depth edges -->
<line x1="111" y1="122" x2="291" y2="43"/>
<line x1="216" y1="194" x2="401" y2="119"/>
<line x1="216" y1="284" x2="399" y2="201"/>
<!-- back edges -->
<line x1="291" y1="43" x2="401" y2="119"/>
<line x1="401" y1="119" x2="399" y2="201"/>
</g>
<!-- dashed altitude "3 m" -->
<line x1="111" y1="124" x2="111" y2="181" fill="none" stroke="#333" stroke-width="1.1" stroke-dasharray="3,3"/>
<!-- angle arc + dot at foot of altitude -->
<path d="M 110 151 A 30 30 0 0 1 84 179" fill="none" stroke="#333" stroke-width="1.1"/>
<circle cx="100" cy="171" r="2.3" fill="#333"/>
<g font-family="Times New Roman,serif" font-size="24" fill="#555">
<text x="118" y="176">3 m</text>
<text x="84" y="300">10 m</text>
<text x="327" y="263">15 m</text>
<text x="412" y="169">4 m</text>
</g>
</svg>
