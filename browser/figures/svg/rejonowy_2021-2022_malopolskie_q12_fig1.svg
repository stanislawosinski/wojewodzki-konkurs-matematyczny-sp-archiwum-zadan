<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400">
  <rect width="760" height="400" fill="#fff"/>

  <!-- construction lines: family a,b,c (slope dx/dy=+0.667) -->
  <line x1="76" y1="16" x2="311.5" y2="369" stroke="#aaaaaa" stroke-width="1"/>
  <line x1="195.5" y1="16" x2="431" y2="369" stroke="#aaaaaa" stroke-width="1"/>
  <line x1="315" y1="16" x2="550.5" y2="369" stroke="#aaaaaa" stroke-width="1"/>

  <!-- construction lines: family d,e,f (slope dx/dy=-1.104) -->
  <line x1="433" y1="16" x2="43.3" y2="369" stroke="#aaaaaa" stroke-width="1"/>
  <line x1="553" y1="16" x2="163.3" y2="369" stroke="#aaaaaa" stroke-width="1"/>
  <line x1="673" y1="16" x2="283.3" y2="369" stroke="#aaaaaa" stroke-width="1"/>

  <!-- construction lines: horizontal family g,h,i -->
  <line x1="45" y1="150.8" x2="685" y2="150.8" stroke="#aaaaaa" stroke-width="1"/>
  <line x1="45" y1="217.7" x2="685" y2="217.7" stroke="#aaaaaa" stroke-width="1"/>
  <line x1="45" y1="284.3" x2="685" y2="284.3" stroke="#aaaaaa" stroke-width="1"/>

  <!-- labels top: a b c d e f -->
  <text x="100" y="45" font-family="Times New Roman,serif" font-style="italic" font-size="20" fill="#333">a</text>
  <text x="222" y="42" font-family="Times New Roman,serif" font-style="italic" font-size="20" fill="#333">b</text>
  <text x="337" y="47" font-family="Times New Roman,serif" font-style="italic" font-size="20" fill="#333">c</text>
  <text x="408" y="42" font-family="Times New Roman,serif" font-style="italic" font-size="20" fill="#333">d</text>
  <text x="528" y="47" font-family="Times New Roman,serif" font-style="italic" font-size="20" fill="#333">e</text>
  <text x="650" y="40" font-family="Times New Roman,serif" font-style="italic" font-size="20" fill="#333">f</text>

  <!-- labels left: g h i -->
  <text x="30" y="135" font-family="Times New Roman,serif" font-style="italic" font-size="20" fill="#333">g</text>
  <text x="30" y="205" font-family="Times New Roman,serif" font-style="italic" font-size="20" fill="#333">h</text>
  <text x="30" y="278" font-family="Times New Roman,serif" font-style="italic" font-size="20" fill="#333">i</text>

  <!-- the closed 12-gon (star) traced over segments of the 9 lines -->
  <polygon points="359.4,84.9 285.1,150.7 166.5,151.2 210.4,217.6 137.1,284.3 254.6,284.1 300.5,350.6 374.4,284.6 494.0,284.2 449.4,217.8 523.5,150.7 404.7,150.7"
           fill="none" stroke="#222222" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- 12 vertex dots -->
  <circle cx="359.4" cy="84.9" r="3" fill="#111"/>
  <circle cx="285.1" cy="150.7" r="3" fill="#111"/>
  <circle cx="166.5" cy="151.2" r="3" fill="#111"/>
  <circle cx="210.4" cy="217.6" r="3" fill="#111"/>
  <circle cx="137.1" cy="284.3" r="3" fill="#111"/>
  <circle cx="254.6" cy="284.1" r="3" fill="#111"/>
  <circle cx="300.5" cy="350.6" r="3" fill="#111"/>
  <circle cx="374.4" cy="284.6" r="3" fill="#111"/>
  <circle cx="494.0" cy="284.2" r="3" fill="#111"/>
  <circle cx="449.4" cy="217.8" r="3" fill="#111"/>
  <circle cx="523.5" cy="150.7" r="3" fill="#111"/>
  <circle cx="404.7" cy="150.7" r="3" fill="#111"/>
</svg>
