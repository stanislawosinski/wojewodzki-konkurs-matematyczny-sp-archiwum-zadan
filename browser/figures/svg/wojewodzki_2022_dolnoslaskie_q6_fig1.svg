  <!-- Seated on the parallels rather than drawn as scanned: the prompt puts ABCD on
       a6,a5,a1,a2 and EFGH on a7,a5,a1,a3, and that is the whole construction. The scan has
       neither quadrilateral touching its lines (gaps 3.2-7.8 px) and draws ABCD as a 298.6 x
       331.0 rectangle, not the square the prompt calls it. Both are refitted as true squares
       with their vertices on the prescribed lines, least squares over the measured line
       positions, so no vertex sits more than 0.18 px off. Sides come out 330.59 and 358.42,
       i.e. 17 and 20 line-spacings squared - the intended difference of 3. -->
