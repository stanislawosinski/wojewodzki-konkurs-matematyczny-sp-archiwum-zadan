<svg xmlns="http://www.w3.org/2000/svg" width="340" height="570" viewBox="0 0 340 570">
<rect width="340" height="570" fill="#fff"/>
<!-- grid grey measured off the scan: #d6d6d6 delivered only 54% of the scan's
     grid ink (photometric rms 5.2); #c5c5c5 sits at the rms optimum (4.0) -->
<g stroke="#c5c5c5" stroke-width="1">
<line x1="46.25" y1="0" x2="46.25" y2="503"/>
<line x1="85.99" y1="0" x2="85.99" y2="503"/>
<line x1="125.73" y1="0" x2="125.73" y2="503"/>
<line x1="165.46" y1="0" x2="165.46" y2="503"/>
<line x1="205.20" y1="0" x2="205.20" y2="503"/>
<line x1="244.93" y1="0" x2="244.93" y2="503"/>
<line x1="284.67" y1="0" x2="284.67" y2="503"/>
<line x1="26" y1="22.90" x2="311" y2="22.90"/>
<line x1="26" y1="67.21" x2="311" y2="67.21"/>
<line x1="26" y1="111.53" x2="311" y2="111.53"/>
<line x1="26" y1="155.85" x2="311" y2="155.85"/>
<line x1="26" y1="200.17" x2="311" y2="200.17"/>
<line x1="26" y1="244.48" x2="311" y2="244.48"/>
<line x1="26" y1="288.80" x2="311" y2="288.80"/>
<line x1="26" y1="333.12" x2="311" y2="333.12"/>
<line x1="26" y1="377.44" x2="311" y2="377.44"/>
<line x1="26" y1="421.75" x2="311" y2="421.75"/>
<line x1="26" y1="466.07" x2="311" y2="466.07"/>
</g>
<!-- the four lobes are half-ELLIPSES, not circular arcs: least-squares over the
     scan's arc ink gives rms 0.21-0.28px for an axis-aligned ellipse (ry/rx
     1.13-1.15 on all four) against 0.41-0.48px for the best circle -->
<path fill="none" stroke="#000" stroke-width="2.2" d="M 86.40 66.50
A 39.50 44.41 0 0 1 165.40 66.50
A 40.10 44.41 0 0 1 245.60 66.50
L 85.40 421.50
A 40.05 44.54 0 0 0 165.50 421.50
A 39.65 43.43 0 0 0 244.80 421.50
Z"/>
</svg>
