<svg xmlns="http://www.w3.org/2000/svg" width="499" height="229" viewBox="0 0 499 229">
  <rect width="499" height="229" fill="#fff"/>
  <g stroke="#9a9a9a" stroke-width="1.4" stroke-linecap="round" fill="none">
    <!-- outer parallelogram edges -->
    <line x1="16" y1="189" x2="107.1" y2="33.2"/>   <!-- A-D -->
    <line x1="107.1" y1="33.2" x2="470.1" y2="34.1"/> <!-- D-C (through N) -->
    <line x1="470.1" y1="34.1" x2="379.3" y2="188.7"/> <!-- C-B -->
    <line x1="16" y1="189" x2="379.3" y2="188.7"/>   <!-- A-B (through M) -->
    <!-- internal cevians forming the 4 equilateral triangles -->
    <line x1="107.1" y1="33.2" x2="197.6" y2="189.9"/> <!-- D-M -->
    <line x1="197.6" y1="189.9" x2="289.6" y2="35.7"/> <!-- M-N -->
    <line x1="289.6" y1="35.7" x2="379.3" y2="188.7"/> <!-- N-B -->
  </g>
  <g fill="#8c8c8c">
    <circle cx="197.6" cy="189.5" r="1.8"/>
    <circle cx="289.2" cy="35.3" r="1.8"/>
  </g>
  <g font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#585858">
    <text x="93" y="27">D</text>
    <text x="472" y="33">C</text>
    <text x="9" y="216">A</text>
    <text x="372" y="217">B</text>
  </g>
</svg>
