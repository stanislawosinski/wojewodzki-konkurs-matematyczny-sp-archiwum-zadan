<svg xmlns="http://www.w3.org/2000/svg" width="790" height="355" viewBox="0 0 790 355">
  <rect width="790" height="355" fill="#fff"/>

  <!-- shaded angle wedges (grey fill, no stroke) -->
  <!-- the source bitmap draws its angle marks as ELLIPTIC arcs centred on the
       vertex (axis ratio ~1.16 on all three, rms fit residual <1.1px); a
       vertex-centred circle is not what is drawn. See notes in the arcs below. -->
  <!-- ONLY TWO wedges are shaded, and that is what the scan shows: measured
       interior grey is 236-238 at A and C but 254-255 (paper white) inside the
       134 deg wedge at B, which the scan draws as a bare arc. The third fill is
       not missing; do not add one. -->
  <path d="M 76.40 273.10 L 124.55 203.63 A 94.6 80.7 0 0 1 171.00 273.10 Z" fill="#ededed"/>
  <path d="M 217.10 70.10 L 176.45 128.75 A 79.3 68.3 0 0 0 284.21 106.49 Z" fill="#ededed"/>

  <!-- angle arcs: rx/ry and endpoints fitted off the bitmap, centre = the vertex -->
  <path d="M 124.55 203.63 A 94.6 80.7 0 0 1 171.00 273.10" fill="none" stroke="#7d7d7d" stroke-width="3.5"/>
  <path d="M 176.45 128.75 A 79.3 68.3 0 0 0 284.21 106.49" fill="none" stroke="#7d7d7d" stroke-width="3.5"/>
  <path d="M 523.68 236.33 A 80.1 69.1 0 0 1 671.60 273.10" fill="none" stroke="#7d7d7d" stroke-width="3.5"/>

  <!-- base line A..B and its extension beyond B -->
  <line x1="75.5" y1="273.1" x2="752.5" y2="273.1" stroke="#555" stroke-width="4.5"/>
  <!-- sides AC and CB -->
  <path d="M 76.4 273.1 L 217.1 70.1 L 591.5 273.1" fill="none" stroke="#555" stroke-width="4.5" stroke-linejoin="miter"/>

  <!-- labels -->
  <g fill="#4a4a4a">
    <text x="216.50" y="53.50" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="bold" font-size="26">C</text>
    <text x="75.50" y="314.50" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="bold" font-size="26">A</text>
    <text x="595.50" y="314.50" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="bold" font-size="26">B</text>
    <text x="226.00" y="119.50" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="bold" font-size="26">?</text>
    <text x="116.50" y="253.50" font-family="Helvetica,Arial,sans-serif" font-weight="bold" font-size="26">34&#176;</text>
    <text x="585.50" y="243.50" font-family="Helvetica,Arial,sans-serif" font-weight="bold" font-size="26">134&#176;</text>
  </g>
</svg>
