    <line x1="33.6" y1="69.9" x2="33.6" y2="283.9"/>
    <!-- diagonals AC and DB -->
    <line x1="33.6" y1="283.9" x2="246.3" y2="69.9"/>
    <line x1="33.6" y1="69.9" x2="246.3" y2="283.9"/>
  </g>
  <g fill="#000" font-family="Times New Roman,serif" font-style="italic" font-size="28">
    <text text-anchor="start" x="12.5" y="64">D</text>
    <text text-anchor="start" x="251" y="64">C</text>
