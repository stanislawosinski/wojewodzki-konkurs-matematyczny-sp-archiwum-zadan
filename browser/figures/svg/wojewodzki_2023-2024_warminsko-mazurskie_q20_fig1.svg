<svg xmlns="http://www.w3.org/2000/svg" width="540" height="275" viewBox="0 0 540 275">
<rect width="540" height="275" fill="#fff"/>
<!-- box front outline -->
<path d="M 29,62 L 336,62 L 336,221 L 29,221 Z" fill="none" stroke="#000" stroke-width="1.8"/>
<!-- rim back edge + diagonals -->
<line x1="29" y1="62" x2="61" y2="30" stroke="#000" stroke-width="1.8"/>
<line x1="336" y1="62" x2="368" y2="30" stroke="#000" stroke-width="1.8"/>
<line x1="61" y1="30" x2="368" y2="30" stroke="#000" stroke-width="1.8"/>
<!-- water top surface -->
<path d="M 30,111 L 332,111 L 364,82 L 62,82 Z" fill="#DEDEDE" stroke="#000" stroke-width="1.6"/>
<!-- water front face -->
<path d="M 30,114 L 335,114 L 335,206 L 30,206 Z" fill="#D5D5D5" stroke="#000" stroke-width="1.6"/>
<!-- water right side face -->
<path d="M 335,114 L 367,82 L 367,175 L 335,206 Z" fill="#AAAAAA" stroke="#000" stroke-width="1.6"/>
<!-- hidden bottom-right box edge -->
<line x1="336" y1="221" x2="368" y2="189" stroke="#000" stroke-width="1.4" stroke-dasharray="4,3"/>
<!-- 90 cm dimension -->
<g stroke="#000" stroke-width="1.3" fill="none">
<line x1="29" y1="224" x2="336" y2="224"/>
<path d="M 29,224 l 8,-4 M 29,224 l 8,4"/>
<path d="M 336,224 l -8,-4 M 336,224 l -8,4"/>
</g>
<text x="150" y="248" font-family="Times New Roman,serif" font-size="19" fill="#000">90 cm</text>
<!-- 80 cm dimension -->
<g stroke="#000" stroke-width="1.3" fill="none">
<line x1="366" y1="32" x2="366" y2="178"/>
<path d="M 366,32 l -4,8 M 366,32 l 4,8"/>
<path d="M 366,178 l -4,-8 M 366,178 l 4,-8"/>
</g>
<text x="392" y="116" font-family="Times New Roman,serif" font-size="19" fill="#000">80 cm</text>
<!-- 60 cm dimension -->
<g stroke="#000" stroke-width="1.3" fill="none">
<line x1="368" y1="190" x2="390" y2="169"/>
<path d="M 368,190 l 1,-9 M 368,190 l 9,1"/>
<path d="M 390,169 l -1,9 M 390,169 l -9,-1"/>
</g>
<text x="390" y="204" font-family="Times New Roman,serif" font-size="19" fill="#000">60 cm</text>
</svg>
