<svg xmlns="http://www.w3.org/2000/svg" width="520" height="500" viewBox="0 0 520 500">
  <rect width="520" height="500" fill="#fff"/>

  <!-- hidden (dashed) edges, drawn first so fill/strokes occlude them naturally -->
  <line x1="314.3" y1="42" x2="315" y2="356" stroke="#606060" stroke-width="1.4" stroke-dasharray="6,4"/>
  <line x1="79" y1="384" x2="315" y2="356" stroke="#606060" stroke-width="1.4" stroke-dasharray="6,4"/>
  <line x1="315" y1="356" x2="370" y2="438" stroke="#606060" stroke-width="1.4" stroke-dasharray="6,4"/>

  <!-- cut-face fill (triangle P1-P3-B1), no stroke -->
  <path d="M 80 66 L 369 123 L 141 459 Z" fill="#fef101" stroke="none"/>

  <!-- thin gray hidden edge P1-B0 -->
  <line x1="80" y1="66" x2="79" y2="384" stroke="#666666" stroke-width="1.3"/>

  <!-- maroon top edge P1-P2 -->
  <line x1="80" y1="66" x2="314" y2="42" stroke="#451c1b" stroke-width="1.8"/>

  <!-- black solid edges -->
  <line x1="80" y1="66" x2="369" y2="123" stroke="#000" stroke-width="2.3"/>
  <line x1="314" y1="42" x2="369" y2="123" stroke="#000" stroke-width="1.8"/>
  <line x1="80" y1="66" x2="140" y2="147" stroke="#000" stroke-width="2.3"/>
  <line x1="140" y1="147" x2="369" y2="123" stroke="#000" stroke-width="2.3"/>
  <line x1="141" y1="147" x2="141" y2="459" stroke="#000" stroke-width="2.3"/>
  <line x1="80" y1="66" x2="141" y2="459" stroke="#000" stroke-width="2.3"/>
  <line x1="369" y1="123" x2="141" y2="459" stroke="#000" stroke-width="2.3"/>
  <line x1="79" y1="384" x2="141" y2="459" stroke="#000" stroke-width="1.8"/>
  <line x1="141" y1="459" x2="370" y2="438" stroke="#000" stroke-width="1.8"/>
  <line x1="369" y1="123" x2="370" y2="438" stroke="#000" stroke-width="1.8"/>
</svg>
