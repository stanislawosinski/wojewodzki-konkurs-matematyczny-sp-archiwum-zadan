<svg xmlns="http://www.w3.org/2000/svg" width="490" height="470" viewBox="0 0 490 470">
  <rect x="0" y="0" width="490" height="470" fill="#ffffff"/>
  <!-- outer square -->
  <rect x="11" y="10" width="438" height="438" fill="none" stroke="#000000" stroke-width="2"/>
  <!-- top-left grey rectangle -->
  <rect x="11" y="10" width="344" height="93" fill="#7f7f7f" stroke="#000000" stroke-width="2"/>
  <!-- bottom-right grey rectangle -->
  <rect x="209" y="250" width="240" height="198" fill="#7f7f7f" stroke="#000000" stroke-width="2"/>
  <!-- diagonal from bottom-left to top-right -->
