<!-- Angle labels: the scan prints them far out into the middle of the triangle. Placed
     here on the internal bisector of their vertex, as close in as a 6px white gap to
     both legs allows (C d=121, A d=78, B d=108 from the vertex) - a deliberate
     deviation from the bitmap, for legibility. A barely moves: its 72px-wide label was
     already at the limit imposed by edge AC. -->
