  <path d="M80 45 H1712" fill="none" stroke="#000" stroke-width="2" />

  <!-- value-axis labels -->
  <g fill="#000">
    <text x="334" y="122" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-weight="bold" font-size="49">150</text>
    <text x="334" y="197" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-weight="bold" font-size="49">125</text>
