    <text x="334" y="348" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-weight="bold" font-size="49">75</text>
    <text x="334" y="423" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-weight="bold" font-size="49">50</text>
    <text x="334" y="498" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-weight="bold" font-size="49">25</text>
    <text x="334" y="574" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-weight="bold" font-size="49">0</text>
