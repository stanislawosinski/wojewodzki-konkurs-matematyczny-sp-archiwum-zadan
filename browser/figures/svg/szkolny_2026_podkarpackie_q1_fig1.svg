<svg xmlns="http://www.w3.org/2000/svg" width="500" height="420" viewBox="0 0 500 420">
  <rect width="500" height="420" fill="#fff"/>

  <!-- left-hand side: yellow over green, separated by the fraction bar -->
  <rect x="43" y="59" width="85" height="117" fill="#fee315"/>
  <rect x="43" y="211" width="85" height="116" fill="#00c449"/>
  <line x1="23" y1="193.5" x2="148" y2="193.5" stroke="#000" stroke-width="5"/>

  <!-- equals sign -->
  <line x1="168" y1="180" x2="222" y2="180" stroke="#000" stroke-width="6"/>
  <line x1="168" y1="207" x2="222" y2="207" stroke="#000" stroke-width="6"/>

  <!-- right-hand side: green , yellow -->
  <rect x="247" y="135" width="85" height="117" fill="#00c449"/>
  <text x="346" y="239.5" font-family="Helvetica,Arial,sans-serif" font-weight="bold" font-size="79.5" text-anchor="middle" fill="#000">,</text>
  <rect x="357" y="135" width="85" height="117" fill="#fee315"/>
</svg>
