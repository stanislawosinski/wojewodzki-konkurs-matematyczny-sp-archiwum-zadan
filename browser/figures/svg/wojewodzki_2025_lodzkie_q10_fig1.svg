<svg xmlns="http://www.w3.org/2000/svg" width="580" height="740" viewBox="0 0 580 740">
  <rect width="580" height="740" fill="#fff"/>

  <!-- cone sides -->
  <line x1="165" y1="34" x2="51" y2="288.5" stroke="#000" stroke-width="1.4"/>
  <line x1="165" y1="34" x2="276" y2="288.5" stroke="#000" stroke-width="1.4"/>

  <!-- top ellipse: thin back (upper) arc -->
  <path d="M 51 288.5 A 112.5 29.5 0 0 0 276 288.5" fill="none" stroke="#000" stroke-width="1.3"/>

  <!-- cylinder sides -->
  <line x1="51" y1="288.5" x2="51" y2="544" stroke="#000" stroke-width="1.4"/>
  <line x1="276" y1="288.5" x2="276" y2="544" stroke="#000" stroke-width="1.4"/>

  <!-- bottom ellipse (all thin) -->
  <ellipse cx="163.5" cy="544" rx="112.5" ry="28" fill="none" stroke="#000" stroke-width="1.3"/>

  <!-- top ellipse: bold front (lower) arc, shared circle emphasised -->
  <path d="M 51 288.5 A 112.5 29.5 0 0 1 276 288.5" fill="none" stroke="#000" stroke-width="5.5"/>

  <!-- dashed radius lines + center dots -->
  <line x1="51" y1="288" x2="163.5" y2="288" stroke="#888" stroke-width="1.2" stroke-dasharray="3,2.5"/>
  <circle cx="163.5" cy="288" r="3" fill="#000"/>
  <line x1="51" y1="544" x2="163.5" y2="544" stroke="#888" stroke-width="1.2" stroke-dasharray="3,2.5"/>
  <circle cx="163.5" cy="544" r="3" fill="#000"/>

  <!-- labels on the solid -->
  <text x="122" y="280" font-family="Times New Roman,serif" font-style="italic" font-size="18" fill="#000" text-anchor="middle">r</text>
  <text x="118" y="536" font-family="Times New Roman,serif" font-style="italic" font-size="18" fill="#000" text-anchor="middle">r</text>
  <text x="237" y="163" font-family="Times New Roman,serif" font-style="italic" font-size="20" fill="#000" text-anchor="middle">l</text>
  <text x="37" y="434" font-family="Times New Roman,serif" font-style="italic" font-size="24" fill="#000" text-anchor="middle">H</text>

  <!-- vertical bracket: 10 cm -->
  <line x1="404.5" y1="22" x2="404.5" y2="555" stroke="#000" stroke-width="8"/>
  <circle cx="404.5" cy="22" r="17" fill="#000"/>
  <circle cx="404.5" cy="555" r="17" fill="#000"/>
  <text x="484" y="212" font-family="Helvetica,Arial,sans-serif" font-size="26" fill="#000" text-anchor="middle">10 cm</text>

  <!-- horizontal bracket: 6 cm -->
  <line x1="49.5" y1="649" x2="280.5" y2="649" stroke="#000" stroke-width="8"/>
  <circle cx="49.5" cy="649" r="15.5" fill="#000"/>
  <circle cx="280.5" cy="649" r="15.5" fill="#000"/>
  <text x="119" y="684" font-family="Helvetica,Arial,sans-serif" font-size="26" fill="#000" text-anchor="middle">6 cm</text>
</svg>
