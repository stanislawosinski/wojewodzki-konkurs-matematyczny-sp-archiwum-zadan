<svg xmlns="http://www.w3.org/2000/svg" width="415" height="335" viewBox="0 0 415 335">
  <rect width="415" height="335" fill="#fff"/>

  <!-- annulus: outer disc grey, inner disc white on top -->
  <circle cx="175" cy="157" r="106" fill="#f0f0f0" stroke="#000" stroke-width="1.3"/>
  <circle cx="175" cy="157" r="53" fill="#fff" stroke="#000" stroke-width="1.3"/>

  <!-- 8 cm vertical measurement (outer diameter) -->
  <line x1="175" y1="51" x2="300" y2="51" stroke="#666" stroke-width="0.8" stroke-dasharray="3,2.5"/>
  <line x1="175" y1="262" x2="300" y2="262" stroke="#666" stroke-width="0.8" stroke-dasharray="3,2.5"/>
  <line x1="300" y1="51" x2="300" y2="262" stroke="#000" stroke-width="1"/>
  <path d="M 296,59 L 300,51 L 304,59" fill="none" stroke="#000" stroke-width="1"/>
  <path d="M 296,254 L 300,262 L 304,254" fill="none" stroke="#000" stroke-width="1"/>
  <text x="306" y="163" font-family="Times New Roman,serif" font-size="17">8 cm</text>

  <!-- 4 cm horizontal measurement (inner diameter) -->
  <line x1="122" y1="157" x2="122" y2="282" stroke="#666" stroke-width="0.8" stroke-dasharray="3,2.5"/>
  <line x1="228" y1="157" x2="228" y2="282" stroke="#666" stroke-width="0.8" stroke-dasharray="3,2.5"/>
  <line x1="122" y1="282" x2="228" y2="282" stroke="#000" stroke-width="1"/>
  <path d="M 130,278 L 122,282 L 130,286" fill="none" stroke="#000" stroke-width="1"/>
  <path d="M 220,278 L 228,282 L 220,286" fill="none" stroke="#000" stroke-width="1"/>
  <text x="153" y="302" font-family="Times New Roman,serif" font-size="17">4 cm</text>
</svg>
