<svg xmlns="http://www.w3.org/2000/svg" width="470" height="470" viewBox="0 0 470 470">
  <rect width="470" height="470" fill="#fff"/>
  <!-- shaded rhombus: G(top) F(left) E(bottom) F'(right) -->
  <path d="M 239.5 77 L 175 187 L 239.5 299 L 304 187 Z" fill="#cccccc" stroke="none"/>
  <!-- trapezoid sides -->
  <line x1="40" y1="401.5" x2="439" y2="401.5" stroke="#000" stroke-width="2"/>
  <line x1="105" y1="77" x2="374" y2="77" stroke="#000" stroke-width="2"/>
  <line x1="40" y1="401.5" x2="105" y2="77" stroke="#000" stroke-width="2"/>
  <line x1="439" y1="401.5" x2="374" y2="77" stroke="#000" stroke-width="2"/>
  <!-- big equilateral triangle A-G-B -->
  <line x1="40" y1="401.5" x2="239.5" y2="77" stroke="#000" stroke-width="2"/>
  <line x1="439" y1="401.5" x2="239.5" y2="77" stroke="#000" stroke-width="2"/>
  <!-- small equilateral triangle D-E-C -->
  <line x1="105" y1="77" x2="239.5" y2="299" stroke="#000" stroke-width="2"/>
  <line x1="374" y1="77" x2="239.5" y2="299" stroke="#000" stroke-width="2"/>
  <!-- vertex dots -->
  <circle cx="40" cy="401.5" r="3.2" fill="#000"/>
  <circle cx="439" cy="401.5" r="3.2" fill="#000"/>
  <circle cx="105" cy="77" r="3.2" fill="#000"/>
  <circle cx="374" cy="77" r="3.2" fill="#000"/>
  <circle cx="175" cy="187" r="3.2" fill="#000"/>
  <circle cx="239.5" cy="299" r="3.2" fill="#000"/>
  <!-- labels -->
  <text x="102" y="70" font-family="Times New Roman,serif" font-size="27">D</text>
  <text x="360" y="68" font-family="Times New Roman,serif" font-size="27">C</text>
  <text x="134" y="202" font-family="Times New Roman,serif" font-size="27">F</text>
  <text x="226" y="334" font-family="Times New Roman,serif" font-size="27">E</text>
  <text x="33" y="438" font-family="Times New Roman,serif" font-size="27">A</text>
  <text x="415" y="438" font-family="Times New Roman,serif" font-size="27">B</text>
</svg>
