<svg xmlns="http://www.w3.org/2000/svg" width="560" height="540" viewBox="0 0 560 540">
  <rect width="560" height="540" fill="#fff"/>

  <!-- box wireframe: solid (visible) edges -->
  <g fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round">
    <!-- front face rectangle -->
    <line x1="57.5" y1="123.5" x2="340.5" y2="123.5"/>
    <line x1="340.5" y1="123.5" x2="340.5" y2="473.5"/>
    <line x1="340.5" y1="473.5" x2="57.5" y2="473.5"/>
    <line x1="57.5" y1="473.5" x2="57.5" y2="123.5"/>
    <!-- top face depth edges -->
    <line x1="57.5" y1="123.5" x2="226" y2="40"/>
    <line x1="340.5" y1="123.5" x2="509.5" y2="40"/>
    <line x1="226" y1="40" x2="509.5" y2="40"/>
    <!-- right face -->
    <line x1="509.5" y1="40" x2="509.5" y2="387.5"/>
    <line x1="340.5" y1="473.5" x2="509.5" y2="387.5"/>
    <!-- top face diagonals crossing at S -->
    <line x1="57.5" y1="123.5" x2="509.5" y2="40"/>
    <line x1="340.5" y1="123.5" x2="226" y2="40"/>
  </g>

  <!-- box wireframe: hidden edges at the far bottom vertex (dashed) -->
  <g fill="none" stroke="#000" stroke-width="1.1" stroke-dasharray="3,2.4" stroke-linecap="round">
    <line x1="226" y1="387.5" x2="57.5" y2="473.5"/>
    <line x1="226" y1="387.5" x2="509.5" y2="387.5"/>
    <line x1="226" y1="387.5" x2="226" y2="40"/>
  </g>

  <!-- pyramid KLMNS edges -->
  <g fill="none" stroke="#000" stroke-width="1.3" stroke-linecap="round">
    <line x1="283.5" y1="82" x2="199" y2="473.5"/>
    <line x1="283.5" y1="82" x2="425" y2="430.5"/>
    <line x1="283.5" y1="82" x2="367.75" y2="387.5"/>
    <line x1="283.5" y1="82" x2="141.75" y2="430.75"/>
    <!-- extra construction line present in the original: S to the front-bottom-right box vertex -->
    <line x1="283.5" y1="82" x2="340.5" y2="473.5"/>
    <line x1="199" y1="473.5" x2="425" y2="430.5"/>
    <line x1="425" y1="430.5" x2="367.75" y2="387.5"/>
    <line x1="367.75" y1="387.5" x2="141.75" y2="430.75"/>
    <line x1="141.75" y1="430.75" x2="199" y2="473.5"/>
  </g>

  <!-- vertex dots -->
  <g fill="#000" stroke="none">
    <circle cx="283.5" cy="82" r="1.8"/>
    <circle cx="199" cy="473.5" r="1.8"/>
    <circle cx="425" cy="430.5" r="1.8"/>
    <circle cx="367.75" cy="387.5" r="1.8"/>
    <circle cx="141.75" cy="430.75" r="1.8"/>
  </g>

  <!-- labels -->
  <g font-family="Times New Roman,serif" font-style="italic" font-size="20" fill="#000">
    <text x="283" y="63" text-anchor="middle">S</text>
    <text x="213" y="500" text-anchor="middle">K</text>
    <text x="126" y="421" text-anchor="middle">N</text>
    <text x="453" y="459" text-anchor="middle">L</text>
    <text x="391" y="374" text-anchor="middle">M</text>
  </g>
</svg>
