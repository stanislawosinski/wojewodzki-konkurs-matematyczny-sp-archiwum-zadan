<svg xmlns="http://www.w3.org/2000/svg" width="920" height="570" viewBox="0 0 920 570">
  <rect width="920" height="570" fill="#fff"/>

  <!-- gridlines -->
  <g stroke="#dddddd" stroke-width="1.5">
    <line x1="133" y1="407" x2="891" y2="407"/>
    <line x1="133" y1="372" x2="891" y2="372"/>
    <line x1="133" y1="336" x2="891" y2="336"/>
    <line x1="133" y1="300" x2="891" y2="300"/>
    <line x1="133" y1="264" x2="891" y2="264"/>
    <line x1="133" y1="228" x2="891" y2="228"/>
    <line x1="133" y1="192" x2="891" y2="192"/>
    <line x1="133" y1="156" x2="891" y2="156"/>
    <line x1="133" y1="121" x2="891" y2="121"/>
    <line x1="133" y1="85"  x2="891" y2="85"/>
    <line x1="133" y1="49"  x2="891" y2="49"/>
  </g>

  <!-- bars -->
  <g fill="#4472c4">
    <rect x="181" y="336" width="48" height="71"/>
    <rect x="333" y="121" width="49" height="286"/>
    <rect x="487" y="264" width="49" height="143"/>
    <rect x="639" y="121" width="48" height="286"/>
    <rect x="792" y="193" width="49" height="214"/>
  </g>

  <!-- axes -->
  <line x1="131" y1="28" x2="131" y2="407" stroke="#656565" stroke-width="2.5"/>
  <line x1="131" y1="407" x2="891" y2="407" stroke="#656565" stroke-width="2.5"/>

  <!-- y tick labels -->
  <g font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="34" fill="#222222">
    <text x="98" y="62">5</text>
    <text x="98" y="139">4</text>
    <text x="96" y="206">3</text>
    <text x="98" y="279">2</text>
    <text x="102" y="354">1</text>
    <text x="96" y="427">0</text>
  </g>

  <!-- x category labels -->
  <g font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="32" fill="#222222">
    <text x="150" y="458">3,70</text>
    <text x="305" y="460">4,40</text>
    <text x="461" y="461">4,90</text>
    <text x="614" y="460">5,20</text>
    <text x="776" y="462">6,00</text>
  </g>

  <!-- axis titles -->
  <text x="40" y="373" transform="rotate(-90 40 373)" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="28" fill="#222222">liczba sklepów</text>
  <text x="170" y="516" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="32" fill="#222222">cena za 1 kg bananów w zł</text>
</svg>
