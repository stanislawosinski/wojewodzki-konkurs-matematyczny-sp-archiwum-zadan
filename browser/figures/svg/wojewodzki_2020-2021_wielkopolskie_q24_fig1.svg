    <path d="M193.8 413.9 L578.3 413.9" stroke-dasharray="15.6 11.1" stroke-dashoffset="4.5" />
    <path d="M193.8 413.9 L39.9 567.6" stroke-dasharray="15.6 11.1" stroke-dashoffset="1" />

