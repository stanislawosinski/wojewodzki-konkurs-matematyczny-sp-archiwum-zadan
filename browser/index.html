<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wszystkie zadania</title>
<link rel="stylesheet" href="app.css">
<script defer src="facets.js"></script>
<script defer src="app.js"></script>
</head>
<body>
<aside class="sidebar">
<label>Szukaj:
<span class="searchwrap">
<input type="text" id="search" placeholder="słowo w treści…">
<button type="button" id="clearSearch" title="Wyczyść wyszukiwanie" aria-label="Wyczyść wyszukiwanie" hidden>×</button>
</span>
</label>
<div class="clearrow">
<a href="#" id="clearFacets" hidden>Wyczyść filtry</a>
<a href="#" id="clearFilters" hidden>Wyczyść wszystko</a>
</div>
<div id="facets"></div>
<label>Pokaż tylko id: <input type="text" id="include" placeholder="hash, hash, …"></label>
<label>Pomiń id: <input type="text" id="exclude" placeholder="hash, hash, …"></label>
<div id="count"></div>
<div class="selrow">
<button type="button" id="useSel">Zaznaczone → „Pokaż tylko id”</button>
<button type="button" id="clearSel">Wyczyść zaznaczenie</button>
<button type="button" id="copySel">Kopiuj</button>
<textarea id="selected" readonly rows="2" placeholder="tu pojawią się id zaznaczonych zadań (przecinkami)"></textarea>
</div>
</aside>
<main class="content">
<h1>Wszystkie zadania</h1><div class="meta"><span id="setsummary">Wczytywanie…</span></div>
<nav class="pager" hidden>
<button type="button" class="prev">‹ Poprzednia</button>
<span class="pageinfo"></span>
<button type="button" class="next">Następna ›</button>
</nav>
<div id="qlist"></div>
<nav class="pager" hidden>
<button type="button" class="prev">‹ Poprzednia</button>
<span class="pageinfo"></span>
<button type="button" class="next">Następna ›</button>
</nav>
</main>
</body></html>
